<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 760" width="1090" height="760" role="img" aria-label="Delivery flow. Row 1: fetch the item, triage, project memory, plan the change, challenge the spec, policy check. Row 2: pick specialists, write failing tests and make them pass, build and verify, challenge the change, policy check, open the PR. Row 3: write the update, update the ticket, merge the PR (always a human), deploy decision with auto-roll for routine bumps, roll out, record the outcome. Punch-outs go to a human only when a policy fires. A validator runs at every handoff and every step writes to the audit trail.">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #172033; }
    .h { font-size: 24px; font-weight: 700; }
    .hs { font-size: 13px; fill: #4E5A6E; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #4E5A6E; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #4E5A6E; }
    .model { font-family: Menlo, Consolas, monospace; font-size: 10.5px; fill: #4E5A6E; }
    .lbl { font-size: 11.5px; fill: #4E5A6E; font-style: italic; }
    .lg { font-size: 12px; fill: #4E5A6E; }
    .agent { fill: #FFFFFF; stroke: #4E5A6E; stroke-width: 1.4; }
    .script { fill: #FBEFD8; stroke: #A96D07; stroke-width: 1.4; }
    .check { fill: #DBF1EE; stroke: #0D8278; stroke-width: 1.4; }
    .build { fill: #FBE4DC; stroke: #C9502F; stroke-width: 1.4; }
    .gate { fill: #EEE8FD; stroke: #6A45D4; stroke-width: 1.8; }
    .gt { fill: #6A45D4; }
    .punch { fill: #FFFFFF; stroke: #6A45D4; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .pt { font-size: 11.5px; font-weight: 600; fill: #6A45D4; }
    .ploop { fill: none; stroke: #6A45D4; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .red { fill: #FAE1E1; stroke: #BF3434; stroke-width: 1.4; }
    .green { fill: #DEF1E4; stroke: #27804A; stroke-width: 1.4; }
    .flow { fill: none; stroke: #4E5A6E; stroke-width: 1.5; }
    .loop { fill: none; stroke: #4E5A6E; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .tick { fill: #A96D07; stroke: #FFFFFF; stroke-width: 1.5; }
    .band { fill: #F2F4F8; stroke: #4E5A6E; stroke-width: 1.2; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5A6E"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A45D4"/></marker>
  </defs>
  <rect width="1090" height="760" fill="#FFFFFF"/>

  <text class="h" x="20" y="38">Delivery flow</text>
  <text class="hs" x="20" y="60">Automated from ticket to PR. Decisions an AI shouldn't make alone go to a human. Every step is on record.</text>

  <!-- legend -->
  <g transform="translate(0,78)">
    <rect class="agent" x="20" y="0" width="22" height="14" rx="3"/><text class="lg" x="48" y="11">AI agent</text>
    <rect class="red" x="118" y="0" width="22" height="7" rx="2"/><rect class="green" x="118" y="7" width="22" height="7" rx="2"/><text class="lg" x="146" y="11">Test-writer / implementer</text>
    <rect class="script" x="316" y="0" width="22" height="14" rx="3"/><text class="lg" x="344" y="11">Deterministic script</text>
    <rect class="check" x="478" y="0" width="22" height="14" rx="3"/><text class="lg" x="506" y="11">Adversarial reviewer</text>
    <rect class="build" x="644" y="0" width="22" height="14" rx="3"/><text class="lg" x="672" y="11">Build or rollout</text>
    <rect class="gate" x="786" y="0" width="22" height="14" rx="7"/><text class="lg" x="814" y="11">Always a human decision</text>
    <rect class="punch" x="20" y="24" width="22" height="14" rx="7"/><text class="lg" x="48" y="35">Punch-out, only when a policy fires</text>
    <circle class="tick" cx="265" cy="31" r="5"/><text class="lg" x="276" y="35">Validator at every handoff</text>
  </g>

  <g transform="translate(0,136)">
    <!-- Row 1 -->
    <rect class="punch" x="180" y="14" width="190" height="28" rx="14"/>
    <text class="pt" x="275" y="32" text-anchor="middle">Unclear? Ask a human</text>
    <line class="ploop" x1="275" y1="76" x2="275" y2="46" marker-end="url(#ap)"/>
    <rect class="punch" x="895" y="14" width="190" height="28" rx="14"/>
    <text class="pt" x="995" y="32" text-anchor="middle">Decision needed? Ask a human</text>
    <line class="ploop" x1="995" y1="76" x2="995" y2="46" marker-end="url(#ap)"/>
    <path class="loop" d="M815 76 C 800 38, 652 38, 637 72" marker-end="url(#a)"/>
    <text class="lbl" x="726" y="40" text-anchor="middle">refuted → redo</text>

    <rect class="script" x="20" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="95" y="106" text-anchor="middle">Fetch the item</text>
    <text class="s" x="95" y="124" text-anchor="middle">tracker adapter</text>
    <rect class="agent" x="200" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="275" y="100" text-anchor="middle">Triage</text>
    <text class="s" x="275" y="117" text-anchor="middle">bug · feature · task</text>
    <text class="model" x="275" y="133" text-anchor="middle">Haiku</text>
    <rect class="agent" x="380" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="455" y="100" text-anchor="middle">Project memory</text>
    <text class="s" x="455" y="117" text-anchor="middle">past decisions, lessons</text>
    <text class="model" x="455" y="133" text-anchor="middle">Haiku</text>
    <rect class="agent" x="560" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="635" y="100" text-anchor="middle">Plan the change</text>
    <text class="s" x="635" y="117" text-anchor="middle">requirements → spec</text>
    <text class="model" x="635" y="133" text-anchor="middle">Sonnet</text>
    <rect class="check" x="740" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="815" y="100" text-anchor="middle">Challenge the spec</text>
    <text class="s" x="815" y="117" text-anchor="middle">tries to refute it</text>
    <text class="model" x="815" y="133" text-anchor="middle">Sonnet</text>
    <rect class="script" x="920" y="78" width="150" height="64" rx="6"/>
    <text class="t" x="995" y="100" text-anchor="middle">Policy check</text>
    <text class="s" x="995" y="117" text-anchor="middle">scope · breaking change</text>
    <text class="s" x="995" y="133" text-anchor="middle">retries · budget</text>

    <line class="flow" x1="171" y1="110" x2="197" y2="110" marker-end="url(#a)"/>
    <line class="flow" x1="351" y1="110" x2="377" y2="110" marker-end="url(#a)"/>
    <line class="flow" x1="531" y1="110" x2="557" y2="110" marker-end="url(#a)"/>
    <line class="flow" x1="711" y1="110" x2="737" y2="110" marker-end="url(#a)"/>
    <line class="flow" x1="891" y1="110" x2="917" y2="110" marker-end="url(#a)"/>
    <circle class="tick" cx="183" cy="110" r="5"/><circle class="tick" cx="363" cy="110" r="5"/><circle class="tick" cx="543" cy="110" r="5"/><circle class="tick" cx="723" cy="110" r="5"/><circle class="tick" cx="903" cy="110" r="5"/>
    <path class="flow" d="M995 143 V200 H95 V254" marker-end="url(#a)"/>
    <circle class="tick" cx="545" cy="200" r="5"/>

    <!-- Row 2 -->
    <path class="loop" d="M635 256 C 606 222, 306 222, 278 252" marker-end="url(#a)"/>
    <text class="lbl" x="456" y="236" text-anchor="middle">refuted → redo</text>
    <rect class="punch" x="720" y="214" width="190" height="28" rx="14"/>
    <text class="pt" x="815" y="232" text-anchor="middle">Decision needed? Ask a human</text>
    <line class="ploop" x1="815" y1="256" x2="815" y2="246" marker-end="url(#ap)"/>

    <rect class="script" x="20" y="258" width="150" height="64" rx="6"/>
    <text class="t" x="95" y="286" text-anchor="middle">Pick specialists</text>
    <text class="s" x="95" y="304" text-anchor="middle">kind of work → roster</text>
    <rect class="red" x="200" y="258" width="150" height="32" rx="6"/>
    <rect class="green" x="200" y="290" width="150" height="32" rx="6"/>
    <text class="t" x="275" y="279" text-anchor="middle" style="font-size:12px">Write failing tests</text>
    <text class="t" x="275" y="311" text-anchor="middle" style="font-size:12px">Make them pass</text>
    <rect class="build" x="380" y="258" width="150" height="64" rx="6"/>
    <text class="t" x="455" y="286" text-anchor="middle">Build &amp; verify</text>
    <text class="s" x="455" y="304" text-anchor="middle">full tests · CI checks</text>
    <rect class="check" x="560" y="258" width="150" height="64" rx="6"/>
    <text class="t" x="635" y="280" text-anchor="middle">Challenge the change</text>
    <text class="s" x="635" y="297" text-anchor="middle">tries to break it</text>
    <text class="model" x="635" y="313" text-anchor="middle">Sonnet</text>
    <rect class="script" x="740" y="258" width="150" height="64" rx="6"/>
    <text class="t" x="815" y="280" text-anchor="middle">Policy check</text>
    <text class="s" x="815" y="297" text-anchor="middle">protected files</text>
    <text class="s" x="815" y="313" text-anchor="middle">retries · budget</text>
    <rect class="script" x="920" y="258" width="150" height="64" rx="6"/>
    <text class="t" x="995" y="286" text-anchor="middle">Open the PR</text>
    <text class="s" x="995" y="304" text-anchor="middle">GitHub adapter</text>

    <line class="flow" x1="171" y1="290" x2="197" y2="290" marker-end="url(#a)"/>
    <line class="flow" x1="351" y1="290" x2="377" y2="290" marker-end="url(#a)"/>
    <line class="flow" x1="531" y1="290" x2="557" y2="290" marker-end="url(#a)"/>
    <line class="flow" x1="711" y1="290" x2="737" y2="290" marker-end="url(#a)"/>
    <line class="flow" x1="891" y1="290" x2="917" y2="290" marker-end="url(#a)"/>
    <circle class="tick" cx="183" cy="290" r="5"/><circle class="tick" cx="363" cy="290" r="5"/><circle class="tick" cx="543" cy="290" r="5"/><circle class="tick" cx="723" cy="290" r="5"/><circle class="tick" cx="903" cy="290" r="5"/>
    <path class="flow" d="M995 323 V380 H95 V434" marker-end="url(#a)"/>
    <circle class="tick" cx="545" cy="380" r="5"/>

    <!-- Row 3 -->
    <rect class="punch" x="180" y="394" width="190" height="28" rx="14"/>
    <text class="pt" x="275" y="412" text-anchor="middle">Client tracker? Ask a human</text>
    <line class="ploop" x1="275" y1="436" x2="275" y2="426" marker-end="url(#ap)"/>

    <rect class="agent" x="20" y="438" width="150" height="64" rx="6"/>
    <text class="t" x="95" y="460" text-anchor="middle">Write the update</text>
    <text class="s" x="95" y="477" text-anchor="middle">summary for the ticket</text>
    <text class="model" x="95" y="493" text-anchor="middle">Haiku</text>
    <rect class="script" x="200" y="438" width="150" height="64" rx="6"/>
    <text class="t" x="275" y="466" text-anchor="middle">Update the ticket</text>
    <text class="s" x="275" y="484" text-anchor="middle">tracker adapter</text>
    <rect class="gate" x="380" y="438" width="150" height="64" rx="32"/>
    <text class="t gt" x="455" y="466" text-anchor="middle">Merge the PR</text>
    <text class="s" x="455" y="484" text-anchor="middle">always a human</text>
    <rect class="gate" x="560" y="438" width="150" height="64" rx="32"/>
    <text class="t gt" x="635" y="466" text-anchor="middle">Approve deploy</text>
    <text class="s" x="635" y="484" text-anchor="middle">routine bumps auto-roll</text>
    <rect class="build" x="740" y="438" width="150" height="64" rx="6"/>
    <text class="t" x="815" y="466" text-anchor="middle">Roll out</text>
    <text class="s" x="815" y="484" text-anchor="middle">GitOps pin · Flux</text>
    <rect class="script" x="920" y="438" width="150" height="64" rx="6"/>
    <text class="t" x="995" y="466" text-anchor="middle">Record the outcome</text>
    <text class="s" x="995" y="484" text-anchor="middle">report · project memory</text>

    <line class="flow" x1="171" y1="470" x2="197" y2="470" marker-end="url(#a)"/>
    <line class="flow" x1="351" y1="470" x2="377" y2="470" marker-end="url(#a)"/>
    <line class="flow" x1="531" y1="470" x2="557" y2="470" marker-end="url(#a)"/>
    <line class="flow" x1="711" y1="470" x2="737" y2="470" marker-end="url(#a)"/>
    <line class="flow" x1="891" y1="470" x2="917" y2="470" marker-end="url(#a)"/>
    <circle class="tick" cx="183" cy="470" r="5"/><circle class="tick" cx="363" cy="470" r="5"/><circle class="tick" cx="543" cy="470" r="5"/><circle class="tick" cx="723" cy="470" r="5"/><circle class="tick" cx="903" cy="470" r="5"/>

    <rect class="band" x="20" y="538" width="1050" height="58" rx="8"/>
    <text class="t" x="40" y="562">Audit trail, under every step</text>
    <text class="m" x="40" y="583">step · agent · model · tokens in / out · cost · validator result</text>
    <text class="t" x="1050" y="573" text-anchor="end" style="font-size:12px">→ weekly end-to-end success rate</text>
  </g>
</svg>
