<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Picking the right specialist: a story tagged backend and contracts goes through a roster lookup, which rejects unknown kinds of work and returns the architect, reviewer and skills for that story. The same test-writer and implementer build every story with those skills loaded.">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #172033; }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #4E5A6E; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #4E5A6E; }
    .mi { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #172033; }
    .lbl { font-size: 11.5px; fill: #4E5A6E; font-style: italic; }
    .foot { font-size: 12px; fill: #4E5A6E; }
    .agent { fill: #FFFFFF; stroke: #4E5A6E; stroke-width: 1.4; }
    .script { fill: #FBEFD8; stroke: #A96D07; stroke-width: 1.4; }
    .flow { fill: none; stroke: #4E5A6E; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5A6E"/></marker>
  </defs>
  <rect width="800" height="250" fill="#FFFFFF"/>
  <text class="h" x="20" y="34">The right specialist for each piece of work</text>

  <g transform="translate(0,50)">
    <rect class="agent" x="20" y="40" width="210" height="90" rx="6"/>
    <text class="t" x="40" y="70">Story 2.1</text>
    <text class="s" x="40" y="92">tagged by the story planner:</text>
    <text class="mi" x="40" y="113">backend, contracts</text>

    <line class="flow" x1="232" y1="85" x2="286" y2="85" marker-end="url(#a)"/>
    <text class="lbl" x="259" y="76" text-anchor="middle">looks up</text>

    <rect class="script" x="290" y="40" width="190" height="90" rx="6"/>
    <text class="t" x="310" y="70">Roster lookup</text>
    <text class="m" x="310" y="92">roster.yaml</text>
    <text class="s" x="310" y="113">unknown kind → rejected</text>

    <line class="flow" x1="482" y1="85" x2="536" y2="85" marker-end="url(#a)"/>
    <text class="lbl" x="509" y="76" text-anchor="middle">returns</text>

    <rect class="agent" x="540" y="30" width="240" height="110" rx="6"/>
    <text class="t" x="560" y="56">Specialists for this story</text>
    <text class="m" x="560" y="80">architect  solution-architect</text>
    <text class="m" x="560" y="100">reviewer   scala-fp-reviewer</text>
    <text class="m" x="560" y="120">skills     scala · akka</text>
  </g>
  <text class="foot" x="20" y="226">A lookup table decides, not the AI. The same test-writer and implementer build every story, with those skills loaded and checked in the audit trail.</text>
</svg>
