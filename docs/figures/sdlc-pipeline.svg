<svg xmlns="http://www.w3.org/2000/svg" width="820" viewBox="0 0 820 640" role="img">
<title>The SDLC pipeline as six certifiable segments</title>
<desc>The pipeline is cut into six segments of two nodes each — analysis, planning, solutioning, readiness, implementation and verification — because a certification's unit is a chain of two to three nodes and the pipeline is eleven. Each segment hands off a schema-backed artifact checked by a deterministic edge hook, or stops at a human punch-out. Only the readiness segment is certified today; the others run attended, and check-certification.py blocks unattended delegation to them. The sdlc-orchestrator sequences the segments but runs none of the checks itself.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#3d3d3a}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#73726c}
.tt{font-size:11px;fill:#73726c}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
g.purple>rect{fill:#EEEDFE;stroke:#534AB7}
g.purple text.th{fill:#3C3489}
g.purple text.ts{fill:#534AB7}
g.teal>rect{fill:#E1F5EE;stroke:#0F6E56}
g.teal text.th{fill:#085041}
g.teal text.ts{fill:#0F6E56}
g.coral>rect{fill:#FAECE7;stroke:#993C1D}
g.coral text.th{fill:#712B13}
g.coral text.ts{fill:#993C1D}
g.gray>rect{fill:#F1EFE8;stroke:#5F5E5A}
g.gray text.th{fill:#444441}
g.gray text.ts{fill:#5F5E5A}
g.amber>rect{fill:#FAEEDA;stroke:#854F0B}
g.amber text.ts{fill:#633806}
.cert{font-size:10px;font-weight:600;fill:#085041}
.uncert{font-size:10px;fill:#73726c}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="820" height="640" fill="#ffffff"/>

<g class="purple">
  <rect x="30" y="26" width="480" height="586" rx="20"/>
  <text class="th" x="270" y="52" text-anchor="middle" dominant-baseline="central">sdlc-orchestrator</text>
  <text class="ts" x="270" y="72" text-anchor="middle" dominant-baseline="central">sequences the segments · runs none of the checks itself</text>
</g>

<text class="tt" x="540" y="52" text-anchor="start" dominant-baseline="central">Eleven nodes cannot be certified as</text>
<text class="tt" x="540" y="68" text-anchor="start" dominant-baseline="central">one chain — the unit is 2–3 nodes. So</text>
<text class="tt" x="540" y="84" text-anchor="start" dominant-baseline="central">the pipeline is six segments, each</text>
<text class="tt" x="540" y="100" text-anchor="start" dominant-baseline="central">independently certifiable, joined by</text>
<text class="tt" x="540" y="116" text-anchor="start" dominant-baseline="central">an edge or a human punch-out.</text>

<!-- analysis -->
<g class="gray">
  <rect x="60" y="100" width="420" height="52" rx="8"/>
  <text class="th" x="76" y="118" text-anchor="start" dominant-baseline="central">analysis <tspan class="uncert">(optional · not certified)</tspan></text>
  <text class="ts" x="76" y="138" text-anchor="start" dominant-baseline="central">analysis → brief.json</text>
</g>
<line x1="270" y1="156" x2="270" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="150" y="160" width="240" height="22" rx="11"/>
  <text class="ts" x="270" y="171" text-anchor="middle" dominant-baseline="central">you: worth planning?</text></g>

<!-- planning -->
<g class="teal">
  <rect x="60" y="186" width="420" height="52" rx="8"/>
  <text class="th" x="76" y="204" text-anchor="start" dominant-baseline="central">planning <tspan class="uncert">(not certified)</tspan></text>
  <text class="ts" x="76" y="224" text-anchor="start" dominant-baseline="central">planning → planning-review → prd-verdict.json</text>
</g>
<line x1="270" y1="242" x2="270" y2="264" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="150" y="246" width="240" height="22" rx="11"/>
  <text class="ts" x="270" y="257" text-anchor="middle" dominant-baseline="central">you: approve the PRD</text></g>

<!-- solutioning -->
<g class="teal">
  <rect x="60" y="272" width="420" height="52" rx="8"/>
  <text class="th" x="76" y="290" text-anchor="start" dominant-baseline="central">solutioning <tspan class="uncert">(not certified)</tspan></text>
  <text class="ts" x="76" y="310" text-anchor="start" dominant-baseline="central">solutioning → solutioning-review → design-verdict.json</text>
</g>
<line x1="270" y1="328" x2="270" y2="350" class="arr" marker-end="url(#arrow)"/>
<g class="amber"><rect x="150" y="332" width="240" height="22" rx="11"/>
  <text class="ts" x="270" y="343" text-anchor="middle" dominant-baseline="central">edge: schema check on the write</text></g>

<!-- readiness: the certified one -->
<g class="teal">
  <rect x="60" y="358" width="420" height="52" rx="8" stroke-width="2.5"/>
  <text class="th" x="76" y="376" text-anchor="start" dominant-baseline="central">readiness <tspan class="cert">— CERTIFIED, both nodes, on haiku</tspan></text>
  <text class="ts" x="76" y="396" text-anchor="start" dominant-baseline="central">readiness → readiness-review → readiness-verdict.json</text>
</g>
<line x1="270" y1="414" x2="270" y2="436" class="arr" marker-end="url(#arrow)"/>
<g class="amber"><rect x="110" y="418" width="320" height="22" rx="11"/>
  <text class="ts" x="270" y="429" text-anchor="middle" dominant-baseline="central">edge: lint-story.py + openspec validate, on the hook</text></g>
<text class="tt" x="540" y="376" text-anchor="start" dominant-baseline="central">Certified first because it was the</text>
<text class="tt" x="540" y="392" text-anchor="start" dominant-baseline="central">cheapest real win: two nodes, both</text>
<text class="tt" x="540" y="408" text-anchor="start" dominant-baseline="central">edges already written, one fixed rule.</text>
<text class="tt" x="540" y="430" text-anchor="start" dominant-baseline="central">See figures/readiness-gate.svg.</text>

<g class="purple"><rect x="150" y="444" width="240" height="22" rx="11"/>
  <text class="ts" x="270" y="455" text-anchor="middle" dominant-baseline="central">you: approve readiness</text></g>
<line x1="270" y1="466" x2="270" y2="488" class="arr" marker-end="url(#arrow)"/>

<!-- implementation -->
<g class="coral">
  <rect x="60" y="492" width="420" height="52" rx="8"/>
  <text class="th" x="76" y="510" text-anchor="start" dominant-baseline="central">implementation <tspan class="uncert">(not certified)</tspan></text>
  <text class="ts" x="76" y="530" text-anchor="start" dominant-baseline="central">implementation → implementation-green → implementation.json</text>
</g>
<line x1="270" y1="548" x2="270" y2="562" class="arr" marker-end="url(#arrow)"/>

<!-- verification -->
<g class="coral">
  <rect x="60" y="566" width="420" height="42" rx="8"/>
  <text class="th" x="76" y="580" text-anchor="start" dominant-baseline="central">verification <tspan class="uncert">(not certified)</tspan></text>
  <text class="ts" x="76" y="598" text-anchor="start" dominant-baseline="central">verification → verification-ci → outcome.json</text>
</g>

<text class="tt" x="540" y="500" text-anchor="start" dominant-baseline="central">An uncertified segment is not a</text>
<text class="tt" x="540" y="516" text-anchor="start" dominant-baseline="central">disabled one: run it attended, with</text>
<text class="tt" x="540" y="532" text-anchor="start" dominant-baseline="central">your judgment at the gate. What it</text>
<text class="tt" x="540" y="548" text-anchor="start" dominant-baseline="central">cannot do is run unattended —</text>
<text class="tt" x="540" y="564" text-anchor="start" dominant-baseline="central">check-certification.py blocks</text>
<text class="tt" x="540" y="580" text-anchor="start" dominant-baseline="central">delegation to it, so the pipeline</text>
<text class="tt" x="540" y="596" text-anchor="start" dominant-baseline="central">stays honest about its own reach.</text>
</svg>
