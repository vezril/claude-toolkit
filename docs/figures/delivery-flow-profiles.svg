<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 480" width="1090" height="480" role="img" aria-label="Delivery flow profiles. A profile is a named slice of one routing table. The triage profile runs: fetch the item, triage, project memory, plan the change, challenge the spec, render the brief, record the outcome. It ends there. The full profile continues from plan the change into solutioning, implementation, verification, the PR, the post-back and the vault update. Handoff between profiles happens through the artifact directory on disk, not through a supervising agent. The brief is a deterministic script, and its edge checks coverage while readability is only measured.">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #172033; }
    .h { font-size: 24px; font-weight: 700; }
    .hs { font-size: 13px; fill: #4E5A6E; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #4E5A6E; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #4E5A6E; }
    .model { font-family: Menlo, Consolas, monospace; font-size: 10.5px; fill: #4E5A6E; }
    .lbl { font-size: 11.5px; fill: #4E5A6E; font-style: italic; }
    .lg { font-size: 12px; fill: #4E5A6E; }
    .pname { font-family: Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #4E5A6E; }
    .agent { fill: #FFFFFF; stroke: #4E5A6E; stroke-width: 1.4; }
    .script { fill: #FBEFD8; stroke: #A96D07; stroke-width: 1.4; }
    .check { fill: #DBF1EE; stroke: #0D8278; stroke-width: 1.4; }
    .gate { fill: #EEE8FD; stroke: #6A45D4; stroke-width: 1.8; }
    .build { fill: #FBE4DC; stroke: #C9502F; stroke-width: 1.4; }
    .red { fill: #FAE1E1; stroke: #BF3434; stroke-width: 1.4; }
    .green { fill: #DEF1E4; stroke: #27804A; stroke-width: 1.4; }
    .flow { fill: none; stroke: #4E5A6E; stroke-width: 1.5; }
    .tick { fill: #A96D07; stroke: #FFFFFF; stroke-width: 1.5; }
    .band { fill: #F2F4F8; stroke: #4E5A6E; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .disk { fill: #FFFFFF; stroke: #4E5A6E; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5A6E"/></marker>
  </defs>
  <rect width="1090" height="480" fill="#FFFFFF"/>

  <text class="h" x="20" y="38">Profiles: one routing table, named slices</text>
  <text class="hs" x="20" y="60">A profile lists the steps it runs and the step it ends on. Handoff is the artifact directory on disk — never a supervising agent.</text>

  <!-- legend -->
  <g transform="translate(0,78)">
    <rect class="agent" x="20" y="0" width="22" height="14" rx="3"/><text class="lg" x="48" y="11">Certified node</text>
    <rect class="script" x="190" y="0" width="22" height="14" rx="3"/><text class="lg" x="218" y="11">Deterministic script</text>
    <rect class="check" x="368" y="0" width="22" height="14" rx="3"/><text class="lg" x="396" y="11">Adversarial reviewer</text>
    <rect class="disk" x="546" y="0" width="22" height="14" rx="3"/><text class="lg" x="574" y="11">Artifacts on disk</text>
    <circle class="tick" cx="708" cy="7" r="5"/><text class="lg" x="719" y="11">Edge check after the write</text>
  </g>

  <!-- the triage profile -->
  <g transform="translate(0,118)">
    <rect class="band" x="14" y="0" width="1062" height="128" rx="8"/>
    <text class="pname" x="28" y="20">profile: triage</text>
    <text class="lbl" x="150" y="20">the Stage 4 certified chain — nothing is implemented, no PR is opened</text>

    <rect class="script" x="24" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="88" y="56" text-anchor="middle">Fetch the item</text>
    <text class="s" x="88" y="73" text-anchor="middle">jira adapter</text>

    <rect class="agent" x="176" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="240" y="52" text-anchor="middle">Triage</text>
    <text class="s" x="240" y="68" text-anchor="middle">bug · feature · task</text>
    <text class="model" x="240" y="83" text-anchor="middle">Sonnet · certified</text>

    <rect class="agent" x="328" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="392" y="52" text-anchor="middle">Project memory</text>
    <text class="s" x="392" y="68" text-anchor="middle">skipped: no vault</text>
    <text class="model" x="392" y="83" text-anchor="middle">optional</text>

    <rect class="agent" x="480" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="544" y="52" text-anchor="middle">Plan the change</text>
    <text class="s" x="544" y="68" text-anchor="middle">epics → stories</text>
    <text class="model" x="544" y="83" text-anchor="middle">Sonnet · certified</text>

    <rect class="check" x="632" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="696" y="52" text-anchor="middle">Challenge it</text>
    <text class="s" x="696" y="68" text-anchor="middle">fresh context</text>
    <text class="model" x="696" y="83" text-anchor="middle">Sonnet · certified</text>

    <rect class="script" x="784" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="848" y="52" text-anchor="middle">Render the brief</text>
    <text class="s" x="848" y="68" text-anchor="middle">fixed template</text>
    <text class="m" x="848" y="83" text-anchor="middle">summary.md</text>

    <rect class="script" x="936" y="32" width="128" height="58" rx="6"/>
    <text class="t" x="1000" y="52" text-anchor="middle">Record outcome</text>
    <text class="s" x="1000" y="68" text-anchor="middle">terminus</text>
    <text class="m" x="1000" y="83" text-anchor="middle">outcome.json</text>

    <line class="flow" x1="153" y1="61" x2="173" y2="61" marker-end="url(#a)"/>
    <line class="flow" x1="305" y1="61" x2="325" y2="61" marker-end="url(#a)"/>
    <line class="flow" x1="457" y1="61" x2="477" y2="61" marker-end="url(#a)"/>
    <line class="flow" x1="609" y1="61" x2="629" y2="61" marker-end="url(#a)"/>
    <line class="flow" x1="761" y1="61" x2="781" y2="61" marker-end="url(#a)"/>
    <line class="flow" x1="913" y1="61" x2="933" y2="61" marker-end="url(#a)"/>
    <circle class="tick" cx="163" cy="61" r="5"/><circle class="tick" cx="315" cy="61" r="5"/>
    <circle class="tick" cx="467" cy="61" r="5"/><circle class="tick" cx="619" cy="61" r="5"/>
    <circle class="tick" cx="771" cy="61" r="5"/><circle class="tick" cx="923" cy="61" r="5"/>

    <text class="lbl" x="848" y="110" text-anchor="middle">coverage blocks · readability only measured</text>
  </g>

  <!-- handoff through disk -->
  <g transform="translate(0,262)">
    <rect class="disk" x="380" y="0" width="330" height="46" rx="6"/>
    <text class="t" x="545" y="21" text-anchor="middle">delivery/&lt;ITEM-KEY&gt;/</text>
    <text class="s" x="545" y="37" text-anchor="middle">position is recomputed from what is here</text>
    <line class="flow" x1="545" y1="-16" x2="545" y2="-3" marker-end="url(#a)"/>
    <line class="flow" x1="545" y1="47" x2="545" y2="60" marker-end="url(#a)"/>
    <text class="lbl" x="726" y="26">no agent decides this — `profile:` is config,</text>
    <text class="lbl" x="726" y="41">and the next profile reads the artifacts</text>
  </g>

  <!-- the full profile -->
  <g transform="translate(0,330)">
    <rect class="band" x="14" y="0" width="1062" height="122" rx="8"/>
    <text class="pname" x="28" y="20">profile: full</text>
    <text class="lbl" x="128" y="20">the default — resumes from the same artifacts; its rate is not a Stage 4 number while propose is uncertified</text>

    <rect class="agent" x="24" y="32" width="124" height="54" rx="6"/>
    <text class="t" x="86" y="50" text-anchor="middle">Propose</text>
    <text class="s" x="86" y="66" text-anchor="middle">OpenSpec change</text>
    <text class="model" x="86" y="80" text-anchor="middle">uncertified</text>

    <rect class="script" x="172" y="32" width="124" height="54" rx="6"/>
    <text class="t" x="234" y="50" text-anchor="middle">Brief</text>
    <text class="s" x="234" y="66" text-anchor="middle">what will change</text>
    <text class="m" x="234" y="80" text-anchor="middle">summary.md</text>

    <rect class="gate" x="320" y="32" width="138" height="54" rx="10"/>
    <text class="t" x="389" y="50" text-anchor="middle">Policy gate</text>
    <text class="s" x="389" y="66" text-anchor="middle">planned paths ·</text>
    <text class="s" x="389" y="79" text-anchor="middle">size · dependencies</text>

    <rect class="red" x="482" y="32" width="124" height="27" rx="5"/>
    <rect class="green" x="482" y="59" width="124" height="27" rx="5"/>
    <text class="t" x="544" y="50" text-anchor="middle">Dev pair</text>
    <text class="s" x="544" y="77" text-anchor="middle">TDD, per task</text>

    <rect class="build" x="630" y="32" width="124" height="54" rx="6"/>
    <text class="t" x="692" y="50" text-anchor="middle">Verify</text>
    <text class="s" x="692" y="66" text-anchor="middle">tests · realized</text>
    <text class="s" x="692" y="79" text-anchor="middle">diff paths</text>

    <rect class="script" x="778" y="32" width="124" height="54" rx="6"/>
    <text class="t" x="840" y="50" text-anchor="middle">Open the PR</text>
    <text class="s" x="840" y="66" text-anchor="middle">forge adapter</text>

    <rect class="gate" x="926" y="32" width="138" height="54" rx="10"/>
    <text class="t" x="995" y="50" text-anchor="middle">Merge · archive</text>
    <text class="s" x="995" y="66" text-anchor="middle">always a human</text>

    <line class="flow" x1="149" y1="59" x2="169" y2="59" marker-end="url(#a)"/>
    <line class="flow" x1="297" y1="59" x2="317" y2="59" marker-end="url(#a)"/>
    <line class="flow" x1="459" y1="59" x2="479" y2="59" marker-end="url(#a)"/>
    <line class="flow" x1="607" y1="59" x2="627" y2="59" marker-end="url(#a)"/>
    <line class="flow" x1="755" y1="59" x2="775" y2="59" marker-end="url(#a)"/>
    <line class="flow" x1="903" y1="59" x2="923" y2="59" marker-end="url(#a)"/>
    <circle class="tick" cx="159" cy="59" r="5"/><circle class="tick" cx="307" cy="59" r="5"/>
    <circle class="tick" cx="617" cy="59" r="5"/><circle class="tick" cx="765" cy="59" r="5"/>

    <text class="lbl" x="28" y="106">The gate reads the proposal&#8217;s planned file paths, so rewording cannot evade it — and the brief explaining the change is already written.</text>
  </g>
</svg>
