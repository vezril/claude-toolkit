# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Behavioral regression tests for skills/finch/SKILL.md — the WITH-SKILL arm.
#
# The naive baseline arm lives in promptfooconfig.baseline.yaml and shares this
# suite's tests.yaml verbatim, so the delta between the two runs is attributable
# to the skill and nothing else.
#
# FULLY DETERMINISTIC — no llm-rubric, so no judge, no grader drift, and a re-run
# costs only the generation. Two tiers (see evals/README.md):
#   routing   — does it reach for the right Finch mechanism?
#   accuracy  — hard claims about Finch's plumbing that must not rot
#   restraint — refusing to bluff / pushing back on a false premise, asserted on
#               the specific claim the answer has to contain rather than graded
#
# Provider is provider/claude.sh (the `claude` CLI) rather than the
# anthropic:claude-agent-sdk used elsewhere in evals/ — see that script's header.
#
# Run from the REPO ROOT:
#   npx promptfoo@latest eval -c evals/finch/promptfooconfig.yaml --no-cache
description: "finch skill — plumbing accuracy, mechanism routing, and restraint"
prompts:
  - file://prompt.txt
providers:
  - id: exec:./provider/claude.sh
    label: sonnet
defaultTest:
  vars:
    skill: file://../../skills/finch/SKILL.md
  assert:
    # Applies to EVERY case: a CLI answer that names the right mechanism but hands
    # out a command that doesn't exist has still wasted the user's afternoon.
    # Added in suite v2 after the baseline transcripts showed exactly that.
    - type: javascript
      metric: no-hallucination
      value: file://asserts/no-invented-commands.js
tests: file://tests.yaml
