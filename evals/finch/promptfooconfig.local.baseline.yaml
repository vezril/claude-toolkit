# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# The NAIVE BASELINE arm for the finch suite: the same model, the same tests.yaml,
# the same asserts — but no SKILL.md in context. Whatever this run already passes is
# knowledge the model has anyway, and the skill gets no credit for it. The gap
# against promptfooconfig.local.yaml is the skill's measured value.
#
# LOCAL provider, pairing with promptfooconfig.local.yaml. There is no CI baseline
# arm: CI's job is catching a regression in the with-skill arm, and a baseline that
# scores ~44% by design would redden it every run. The baseline is a measurement
# you take deliberately, not a gate.
#
# Run from the REPO ROOT:
#   npx promptfoo@latest eval -c evals/finch/promptfooconfig.local.baseline.yaml --no-cache
description: "finch skill — NAIVE BASELINE (no skill in context)"
prompts:
  - file://prompt-baseline.txt
providers:
  - id: exec:./provider/claude.sh
    label: sonnet-baseline
defaultTest:
  assert:
    # Identical to the with-skill arm (suite v2). Both arms must be scored by the
    # same asserts or the delta means nothing.
    - type: javascript
      metric: no-hallucination
      value: file://asserts/no-invented-commands.js
tests: file://tests.yaml
