# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# writing-for-adhd - form, triage, tone, altitude
# Both arms share tests.yaml verbatim; only the prompt and the skill var differ.
# Fully deterministic - no llm-rubric, so no judge and no grader drift.
#
# Run from this directory:
#   npx promptfoo@latest eval -c promptfooconfig.yaml --no-cache
description: "writing-for-adhd - form, triage, tone, altitude"
prompts:
  - file://prompt.txt
providers:
  - id: exec:../_provider/claude.sh
    label: sonnet
defaultTest:
  vars:
    skill: file://../../skills/writing-for-adhd/SKILL.md
  assert:
    # Form checks apply to every case; per-case asserts are in tests.yaml.
    - type: javascript
      metric: form
      value: file://asserts/form.js
tests: file://tests.yaml
