# toolkit-archive: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "referrer"
  vars: { request: file://cases/referrer.txt }
  assert:
    - type: javascript
      metric: safety
      value: |
        if (!/referrer|still (uses|references)|never archive|refuse|not|blocked/i.test(output)) throw new Error('refuses to archive a component an active one still uses');
        return true;

- description: "coexist"
  vars: { request: file://cases/coexist.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/never coexist|not coexist|cannot both|one or the other|remove/i.test(output)) throw new Error('says the component and its archived copy must never coexist');
        return true;
