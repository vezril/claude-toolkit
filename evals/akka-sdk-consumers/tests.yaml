# akka-sdk-consumers: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "ignore"
  vars: { request: file://cases/ignore.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/ignore\(\)|ignore|skip/i.test(output)) throw new Error('says ignore() events you do not care about');
        return true;

- description: "kv-intermediate"
  vars: { request: file://cases/kv-intermediate.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/only the latest|not guarantee|no\b|cannot|intermediate|event.sourc/i.test(output)) throw new Error('says only the latest state is guaranteed');
        return true;
