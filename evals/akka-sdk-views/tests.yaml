# akka-sdk-views: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "consistency"
  vars: { request: file://cases/consistency.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/eventually consistent|eventual|not.{0,25}synchron|Awaitility|poll|retry/i.test(output)) throw new Error('says views are eventually consistent; poll rather than read-your-write');
        return true;

- description: "anatomy"
  vars: { request: file://cases/anatomy.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/TableUpdater|@Consume|@Query|row|table/i.test(output)) throw new Error('names the view component parts');
        return true;
