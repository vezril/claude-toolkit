# event-storming: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "notation"
  vars: { request: file://cases/notation.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/orange/i.test(output)) throw new Error('orange for domain events');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/past tense/i.test(output)) throw new Error('past tense phrasing');
        return true;

- description: "hotspots"
  vars: { request: file://cases/hotspots.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/hot ?spot/i.test(output)) throw new Error('names hot spots');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/valuable|most useful|output|good|not.{0,20}fail|surfac/i.test(output)) throw new Error('frames hot spots as valuable output');
        return true;

- description: "deliverable"
  vars: { request: file://cases/deliverable.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/learning|shared understanding|understanding|questions|not the (sticky|artifact)|artifact matters less/i.test(output)) throw new Error('says learning/shared understanding is the deliverable');
        return true;
