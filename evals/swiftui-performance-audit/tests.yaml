# swiftui-performance-audit: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "no-code"
  vars: { request: file://cases/no-code.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/code|see|share|show me|minimal|which view|what does/i.test(output)) throw new Error('asks for the code or a minimal repro first');
        return true;

- description: "formatter"
  vars: { request: file://cases/formatter.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/body|re-?creat|every|expensive|hoist|static|outside|stored/i.test(output)) throw new Error('identifies the formatter being rebuilt in body');
        return true;

- description: "measure"
  vars: { request: file://cases/measure.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/measur|profil|Instruments|first|before|identify|evidence/i.test(output)) throw new Error('requires measuring before optimising');
        return true;
