# swift-concurrency-expert: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "smallest-fix"
  vars: { request: file://cases/smallest-fix.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/unchecked|not|don'?t|avoid|last resort|silenc|suppress|unsafe/i.test(output)) throw new Error('pushes back on @unchecked Sendable as a silencer');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/@MainActor|isolat|smallest|minimal/i.test(output)) throw new Error('offers the smallest safe isolation fix');
        return true;

- description: "global-state"
  vars: { request: file://cases/global-state.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/actor|@MainActor|Mutex|allocator|nonisolated\(unsafe\)|let\b/i.test(output)) throw new Error('offers actor / immutability rather than a lock-by-hand');
        return true;

- description: "offload"
  vars: { request: file://cases/offload.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/nonisolated|detach|Task\.detached|background|off the main actor|concurrentPerform/i.test(output)) throw new Error('moves work off the main actor correctly');
        return true;
