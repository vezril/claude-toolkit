# software-design: shared matrix, used verbatim by both arms. Deterministic asserts only.


- description: "deep-modules"
  vars: { request: file://cases/deep-modules.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/shallow|deep module|too many|thin|classitis|interface.{0,30}(complex|bigger)/i.test(output)) throw new Error('identifies shallow modules / classitis -- not found');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/deep/i.test(output)) throw new Error('uses the deep-module framing -- not found');
        return true;

- description: "errors"
  vars: { request: file://cases/errors.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/define.{0,20}(error|exception).{0,20}out of existence|out of existence|can'?t occur|cannot occur|idempotent|eliminat/i.test(output)) throw new Error('offers define-errors-out-of-existence -- not found');
        return true;

- description: "design-twice"
  vars: { request: file://cases/design-twice.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/design it twice|two (genuinely )?different|alternative design|second design|more than one design/i.test(output)) throw new Error('prescribes designing it twice -- not found');
        return true;
