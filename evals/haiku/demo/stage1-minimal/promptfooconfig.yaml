# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# STAGE 1 — the smallest thing that is still an eval.
# A prompt, a model, one case, one check. Everything later is elaboration.
#   cd demo/stage1-minimal && npx promptfoo eval
description: "demo stage 1: the smallest eval"

prompts:
  - "Write a haiku about {{topic}}."

providers:
  - id: anthropic:claude-agent-sdk
    label: haiku
    config:
      model: haiku
      apiKeyRequired: false
      max_turns: 3

tests:
  - vars:
      topic: winter
    assert:
      # The failure we can already predict: chat framing around the poem.
      - type: not-contains
        value: "Here's a haiku"
