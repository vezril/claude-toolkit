# akka-sdk-timed-actions: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "order"
  vars: { request: file://cases/order.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/before|register.{0,30}first|timer first/i.test(output)) throw new Error('says register the timer before the business operation');
        return true;

- description: "stability"
  vars: { request: file://cases/stability.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/stable|component id|method name|serial|break|cannot (be )?resolv|orphan|fail/i.test(output)) throw new Error('warns the serialized timer stores component id and method name');
        return true;
