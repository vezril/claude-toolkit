# akka-sdk-endpoints: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "thin"
  vars: { request: file://cases/thin.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/thin|delegat|ComponentClient|out of the endpoint|domain logic/i.test(output)) throw new Error('says endpoints are thin and delegate via ComponentClient');
        return true;

- description: "streaming"
  vars: { request: file://cases/streaming.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/offset|lastSeenSseEventId|resume|reconnect|rebalanc/i.test(output)) throw new Error('designs for reconnection with offsets rather than a long-lived connection');
        return true;
