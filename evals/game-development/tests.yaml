# game-development: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "routing"
  vars: { request: file://cases/routing.txt }
  assert:
    - type: javascript
      metric: routing
      value: |
        if (!/prototyp|find the fun|core loop/i.test(output)) throw new Error('routes to prototyping / find the fun first');
        return true;
    - type: javascript
      metric: routing
      value: |
        if (!/game-design|design|GDD/i.test(output)) throw new Error('routes to design/GDD');
        return true;

- description: "playtest"
  vars: { request: file://cases/playtest.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/playtest|real players|observ|test with/i.test(output)) throw new Error('requires playtesting as the quality gate');
        return true;
