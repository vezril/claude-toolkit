# release-macos-spm-packaging: shared matrix, used verbatim by both arms. Deterministic asserts only.


- description: "bundle"
  vars: { request: file://cases/bundle.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/\.app|bundle/i.test(output)) throw new Error('covers the .app bundle -- not found');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/Info\.plist/i.test(output)) throw new Error('mentions Info.plist -- not found');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/Contents\/MacOS|Contents\//i.test(output)) throw new Error('gives the bundle layout -- not found');
        return true;

- description: "menubar"
  vars: { request: file://cases/menubar.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/LSUIElement|agent|menu ?bar/i.test(output)) throw new Error('names LSUIElement or the agent-app setting -- not found');
        return true;
