# akka-sdk-key-value-entities: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "mutate"
  vars: { request: file://cases/mutate.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/updateState|effects\(\)|never mutat|not mutat|lost|reload/i.test(output)) throw new Error('says the only way to change state is effects().updateState');
        return true;

- description: "vs-ese"
  vars: { request: file://cases/vs-ese.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/event.sourc|ESE/i.test(output)) throw new Error('points at event sourced entities');
        return true;
