# akka-insights: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "added"
  vars: { request: file://cases/added.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/agent|javaagent|dependenc|sbt|library|config|token/i.test(output)) throw new Error('describes how it is added rather than inventing an API');
        return true;
