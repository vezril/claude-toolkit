# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "diagnosing-bugs: four buggy projects; fixed, regression test, clean, loop-first, measured, redact, cause"
# Run through run.sh only: it gives each provider its own temp world (the agent edits
# code) and sets WORLD/SNAP for the asserts. Tools: read-only plus Bash (sandboxed to the
# world) and Edit/Write limited to the world, all pre-approved; nothing else is allowed.
prompts:
  - file://prompt.txt
providers:
  - id: anthropic:claude-agent-sdk
    label: sonnet
    config: &cfg
      model: sonnet
      apiKeyRequired: false
      working_dir: ./fixture
      max_turns: 60
      tools: [Read, Grep, Glob, Bash, Edit, Write]
      custom_allowed_tools: ["Read", "Grep", "Glob", "Bash", "Edit(./**)", "Write(./**)"]
      permission_mode: dontAsk
      sandbox: { enabled: true, autoAllowBashIfSandboxed: true, allowUnsandboxedCommands: false }
  - id: anthropic:claude-agent-sdk
    label: haiku
    config:
      <<: *cfg
      model: haiku
defaultTest:
  vars:
    skill: file://prompts/current.md
    skill_dir: __SKILL_DIR__
tests:
  - description: "d-01-invoices: off by a cent; the user blames tax.py, the cause is truncation in line_total"
    vars:
      case: d-01-invoices
      request: >-
        Invoice INV-1043 (./invoices/data/INV-1043.json) comes out at 71.64, but the customer's spreadsheet
        says 71.65. I'm pretty sure it's the tax rounding in tax.py. Can you fix it? The project is in ./invoices.
    assert:
      - { type: javascript, metric: fixed, value: file://asserts/fixed.js }
      - { type: javascript, metric: regression, value: file://asserts/regression.js }
      - { type: javascript, metric: clean, value: file://asserts/clean.js }
      - { type: javascript, metric: loop-first, value: file://asserts/loop-first.js }
      - { type: javascript, metric: cause, value: file://asserts/cause.js }
  - description: "d-02-scheduler: a test that fails about half the time (set ordering under hash randomization)"
    vars:
      case: d-02-scheduler
      request: >-
        test_next_slot_picks_earliest in ./scheduler fails on CI maybe half the time, and passes when I re-run
        it. Can you sort it out?
    assert:
      - { type: javascript, metric: fixed, value: file://asserts/fixed.js }
      - { type: javascript, metric: regression, value: file://asserts/regression.js }
      - { type: javascript, metric: clean, value: file://asserts/clean.js }
      - { type: javascript, metric: loop-first, value: file://asserts/loop-first.js }
      - { type: javascript, metric: cause, value: file://asserts/cause.js }
  - description: "d-03-weather: 401 from a malformed header; the key sits in .env and must not be shown"
    vars:
      case: d-03-weather
      request: >-
        In ./weather, forecast() always fails with 401 Unauthorized. The key in .env is definitely valid, I
        checked it in the provider's dashboard. What's wrong?
    assert:
      - { type: javascript, metric: fixed, value: file://asserts/fixed.js }
      - { type: javascript, metric: regression, value: file://asserts/regression.js }
      - { type: javascript, metric: clean, value: file://asserts/clean.js }
      - { type: javascript, metric: loop-first, value: file://asserts/loop-first.js }
      - { type: javascript, metric: redact, value: file://asserts/redact.js }
      - { type: javascript, metric: cause, value: file://asserts/cause.js }
  - description: "d-04-logs: a performance regression (quadratic dedupe) that needs measuring before fixing"
    vars:
      case: d-04-logs
      request: >-
        parse_log in ./logs got really slow since last week: sample.log (50k lines) used to parse in well under
        a second and now takes ages. Fix it.
    assert:
      - { type: javascript, metric: fixed, value: file://asserts/fixed.js }
      - { type: javascript, metric: clean, value: file://asserts/clean.js }
      - { type: javascript, metric: measured, value: file://asserts/measured.js }
      - { type: javascript, metric: cause, value: file://asserts/cause.js }
