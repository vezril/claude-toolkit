# swiftui-liquid-glass: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "interactive"
  vars: { request: file://cases/interactive.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/only|not all|tappable|focusab|interactive element|no\b/i.test(output)) throw new Error('restricts interactive() to actually interactive elements');
        return true;

- description: "overuse"
  vars: { request: file://cases/overuse.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/not every|sparing|overuse|avoid|selective|hierarch|too much|legib/i.test(output)) throw new Error('pushes back on applying glass everywhere');
        return true;
