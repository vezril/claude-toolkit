# openclaw-agents: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "async"
  vars: { request: file://cases/async.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/runId|run id|async|asynchron|immediately returns|accepted/i.test(output)) throw new Error('explains the async runId contract');
        return true;

- description: "delegation"
  vars: { request: file://cases/delegation.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/sessions_spawn|spawn/i.test(output)) throw new Error('names sessions_spawn');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/sessions_yield|yield|background|run id/i.test(output)) throw new Error('names yield / background run');
        return true;
