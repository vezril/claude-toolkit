# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "delivery-flow breakdown node: schema, coverage, acceptance, scope on 6 standard-path items"
# The node reads item.json + triage.json and writes breakdown.json. No working_dir: no tools,
# so it breaks down the item it is given rather than going to read the repo it came from.
prompts:
  - file://prompt.txt
providers:
  - id: anthropic:claude-agent-sdk
    label: haiku
    config:
      model: haiku
      apiKeyRequired: false
      max_turns: 5
  - id: anthropic:claude-agent-sdk
    label: sonnet
    config:
      model: sonnet
      apiKeyRequired: false
      max_turns: 5
defaultTest:
  vars:
    skill: file://prompts/current.md
  assert:
    - type: javascript
      metric: schema
      value: file://asserts/schema.js
    - type: javascript
      metric: coverage
      value: file://asserts/coverage.js
    - type: javascript
      metric: acceptance
      value: file://asserts/acceptance.js
    - type: javascript
      metric: scope
      value: file://asserts/scope.js
tests:
  - description: "case-01-pantry-items"
    vars:
      case: case-01-pantry-items
      item: file://inputs/case-01-pantry-items.item.json
      triage: file://inputs/case-01-pantry-items.triage.json
  - description: "case-02-sidebar-nav"
    vars:
      case: case-02-sidebar-nav
      item: file://inputs/case-02-sidebar-nav.item.json
      triage: file://inputs/case-02-sidebar-nav.triage.json
  - description: "case-03-auth-tenancy"
    vars:
      case: case-03-auth-tenancy
      item: file://inputs/case-03-auth-tenancy.item.json
      triage: file://inputs/case-03-auth-tenancy.triage.json
  - description: "case-05-clustering"
    vars:
      case: case-05-clustering
      item: file://inputs/case-05-clustering.item.json
      triage: file://inputs/case-05-clustering.triage.json
  - description: "case-06-metrics-endpoint"
    vars:
      case: case-06-metrics-endpoint
      item: file://inputs/case-06-metrics-endpoint.item.json
      triage: file://inputs/case-06-metrics-endpoint.triage.json
  - description: "case-07-dlq-endpoints"
    vars:
      case: case-07-dlq-endpoints
      item: file://inputs/case-07-dlq-endpoints.item.json
      triage: file://inputs/case-07-dlq-endpoints.triage.json
