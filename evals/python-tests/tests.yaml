# python-tests: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "territory"
  vars: { request: file://cases/territory.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/not|won'?t|territor|python-package|separate|only.{0,25}test|prerequisite/i.test(output)) throw new Error('declines to write production sources');
        return true;

- description: "no-src"
  vars: { request: file://cases/no-src.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/python-package|prerequisite|refus|empty|error|src/i.test(output)) throw new Error('names python-package as the prerequisite and refuses');
        return true;
