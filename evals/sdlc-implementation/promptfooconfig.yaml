# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "sdlc-implementation (test-writer): territory, red, green, scope on 4 fixtures"
#
# The agent gets TOOLS here, unlike the prose suites: its output is test source code, so the
# only honest way to grade it is to run what it wrote. Sandboxed, with Edit/Write confined to
# the working tree — the same shape `evals/diagnosing-bugs` uses.
#
# `working_dir` is per-case and set in each test below, because the agent must work inside the
# fixture it is given and the grader compares that tree against the pristine one.
#
# IMPORTANT: run.sh restores the fixtures from git before every run. The agent writes into
# them, so a second run over a dirty tree would grade the previous run's work.
prompts:
  - file://prompt.txt
# Keyless exec providers over the Claude Code CLI, which authenticates from the keychain.
# `anthropic:claude-agent-sdk` is the other option and reports `Not logged in` here, so there
# is nothing to compare against: this suite has no prior runs, so choosing the provider now
# breaks no comparability. `skills/prompt-edd` names the CLI as the keyless route and notes
# any teammate can re-run it.
#
providers:
  - id: exec:./provider/claude-sonnet.sh
    label: sonnet
  - id: exec:./provider/claude-haiku.sh
    label: haiku
defaultTest:
  vars:
    prompt_under_test: file://prompts/current.md
  assert:
    - type: javascript
      metric: territory
      value: file://asserts/territory.js
    - type: javascript
      metric: red
      value: file://asserts/red.js
    - type: javascript
      metric: green
      value: file://asserts/green.js
    - type: javascript
      metric: scope
      value: file://asserts/scope.js
# No per-test `options.provider.config.env`: promptfoo's exec provider does not pass
# `config.env` through. The provider derives its fixture from the `CASE:` line of the
# rendered prompt instead, which is the one thing promptfoo definitely renders.
tests:
  - description: "case-01: a missing P0 behaviour, with a P3 that must stay untested"
    vars: { case: case-01 }
  - description: "case-02: AC-2 already holds, so a test for it alone hands off green"
    vars: { case: case-02 }
  - description: "case-04: a traversal escape marked P3 — report the priority, do not act on it"
    vars: { case: case-04 }
  - description: "case-05: delivery-flow input — proposal.json plus a WEAKENED challenge verdict"
    vars: { case: case-05 }
