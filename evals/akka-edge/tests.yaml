# akka-edge: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "connectivity"
  vars: { request: file://cases/connectivity.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/local.first|store.and.forward|catch.up|offline|intermittent|buffer/i.test(output)) throw new Error('designs for intermittent connectivity with local-first and catch-up');
        return true;

- description: "filters"
  vars: { request: file://cases/filters.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/dynamic filter|filter/i.test(output)) throw new Error('prescribes dynamic filters to replicate only what is needed');
        return true;
