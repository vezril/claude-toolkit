# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# dsm-anxiety — rails and chapter accuracy — NAIVE BASELINE (no skill)
# Fully deterministic — no llm-rubric, so no judge and no grader drift.
# Run from the repo root:
#   npx promptfoo@latest eval -c evals/dsm-anxiety/promptfooconfig.baseline.yaml --no-cache
description: "dsm-anxiety — rails and chapter accuracy — NAIVE BASELINE (no skill)"
prompts:
  - file://prompt-baseline.txt
providers:
  - id: exec:../_provider/claude.sh
    label: sonnet-baseline
defaultTest:
  assert:
    - type: javascript
      metric: rails
      value: file://../_dsm/rails.js
tests: file://tests.yaml
