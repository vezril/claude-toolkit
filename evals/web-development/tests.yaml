# web-development: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "rendering"
  vars: { request: file://cases/rendering.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/behind a login|authenticat|private|per-user|no SEO|dynamic/i.test(output)) throw new Error('reasons from the auth/SEO characteristics rather than dogma');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/SPA|client-side|CSR|SSR/i.test(output)) throw new Error('names the strategies');
        return true;

- description: "stack"
  vars: { request: file://cases/stack.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/depend|factor|trade-?off|context|team|no single|it varies/i.test(output)) throw new Error('gives factors rather than dogma');
        return true;
