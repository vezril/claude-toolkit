# python-package: shared matrix, used verbatim by both arms. Deterministic asserts only.


- description: "no-tests"
  vars: { request: file://cases/no-tests.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/not|won'?t|outside|territor|separate|test-writer|another skill|only.{0,30}(production|source)/i.test(output)) throw new Error('declines to write tests -- not found');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/src\/|__init__/i.test(output)) throw new Error('scaffolds src layout -- not found');
        return true;

- description: "typed"
  vars: { request: file://cases/typed.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/src\/|__init__\.py/i.test(output)) throw new Error('names the src layout and __init__ -- not found');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/typ(ed|ing)|py\.typed|type hint|annotat/i.test(output)) throw new Error('notes it is typed -- not found');
        return true;
