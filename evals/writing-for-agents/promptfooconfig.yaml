# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "writing-for-agents: rewrite agent docs; preserve, prune, pointer, disclosure, steps, positive"
# Run through run.sh (temp world, prompt version pinned). The documents are inlined in
# the request; read-only tools exist only so a skill can read its own disclosed files
# from the base directory (v2 points at SKILL-MECHANICS.md). Generated by gen-config.js.
prompts:
  - file://prompt.txt
providers:
  - id: anthropic:claude-agent-sdk
    label: sonnet
    config: { model: sonnet, apiKeyRequired: false, working_dir: ./fixture/workspace, max_turns: 12 }
  - id: anthropic:claude-agent-sdk
    label: haiku
    config: { model: haiku, apiKeyRequired: false, working_dir: ./fixture/workspace, max_turns: 12 }
defaultTest:
  vars:
    skill: file://prompts/current.md
    skill_dir: __SKILL_DIR__
tests:
  - description: "w-01-changelog: a bloated skill: no-ops, a duplicate rule, synonym-stuffed description, steps with no done-when, a monorepo table only one branch needs, a passive-voice prohibition"
    vars:
      case: w-01-changelog
      request: |-
        Rewrite this skill so an agent runs it predictably. It lives at `skills/changelog/SKILL.md`.

        ### skills/changelog/SKILL.md

        ````
        ---
        name: changelog
        description: This skill helps you write changelogs. It is a skill for changelogs, change logs, release notes, CHANGELOG.md files, version history and the history of changes. Use it when the user wants a changelog, wants release notes, asks about the changelog, mentions CHANGELOG.md, or is releasing one package of a monorepo.
        ---

        # Changelog

        You are an expert technical writer with years of experience writing changelogs.

        Be thorough and careful.

        ## Steps

        1. Read the git log since the last tag.
        2. Group the commits into Added, Changed, Fixed and Removed.
        3. Write the entry at the top of CHANGELOG.md.

        Always follow the Keep a Changelog format.

        ## Rules

        - Don't use passive voice.
        - Never include merge commits.
        - Make sure to always follow the Keep a Changelog format.
        - Breaking changes go first, under a **BREAKING** label, because downstream teams search for that word before upgrading.

        ## Monorepo packages

        When the repo is a monorepo, map each conventional-commit scope to its package and write one entry per package, using this table:

        | scope | package | changelog path |
        |-------|---------|----------------|
        | api | billing-api | packages/billing-api/CHANGELOG.md |
        | web | storefront | apps/storefront/CHANGELOG.md |
        | auth | auth-service | packages/auth-service/CHANGELOG.md |
        | jobs | job-runner | packages/job-runner/CHANGELOG.md |
        | ui | design-system | packages/design-system/CHANGELOG.md |
        | sdk | client-sdk | packages/client-sdk/CHANGELOG.md |
        | infra | (none) | skip: infra changes are not released |
        | docs | (none) | skip: docs changes are not released |
        ````

        Reply with the revised file(s) only: each one as a `### <path>` heading followed by a single fenced block holding the whole file. If you split anything into a new file, include it the same way.
    assert:
      - { type: javascript, metric: format, value: file://asserts/format.js }
      - { type: javascript, metric: preserve, value: file://asserts/preserve.js }
      - { type: javascript, metric: prune, value: file://asserts/prune.js }
      - { type: javascript, metric: pointer, value: file://asserts/pointer.js }
      - { type: javascript, metric: disclosure, value: file://asserts/disclosure.js }
      - { type: javascript, metric: steps, value: file://asserts/steps.js }
      - { type: javascript, metric: positive, value: file://asserts/positive.js }
  - description: "w-02-claude-md: a CLAUDE.md that restates package.json and the directory layout, with negations that have positive targets, one hard guardrail, and two unwritten conventions that must survive"
    vars:
      case: w-02-claude-md
      request: |-
        Tighten this CLAUDE.md. Here it is, along with the repo's package.json for reference.

        ### CLAUDE.md

        ````
        # CLAUDE.md

        This is the pantry-web repo. It is a Next.js app.

        ## Commands

        - Install: `npm install`
        - Run the dev server: `npm run dev`
        - Run the tests: `npm test`
        - Lint: `npm run lint`

        ## Layout

        - `app/` contains the routes
        - `components/` contains React components
        - `lib/` contains utilities
        - `public/` contains static assets

        ## Rules

        - Don't use `any`.
        - Don't use default exports.
        - Never commit directly to main.
        - Please make sure you write good, clean code.
        - Payments: always go through `lib/legacy-gateway.ts`, never call the Stripe SDK directly. The legacy gateway records every charge in the ledger service, and a direct Stripe call skips the ledger, which is how we double-billed customers in March.
        - Dates are stored in UTC and rendered in the user's timezone with `formatLocal()`; the server never knows the user's timezone.
        ````

        ### package.json

        ````
        {
          "name": "pantry-web",
          "private": true,
          "scripts": {
            "dev": "next dev",
            "build": "next build",
            "test": "vitest run",
            "lint": "eslint ."
          }
        }
        ````

        Reply with the revised CLAUDE.md only, as a `### CLAUDE.md` heading followed by a single fenced block holding the whole file.
    assert:
      - { type: javascript, metric: format, value: file://asserts/format.js }
      - { type: javascript, metric: preserve, value: file://asserts/preserve.js }
      - { type: javascript, metric: prune, value: file://asserts/prune.js }
      - { type: javascript, metric: positive, value: file://asserts/positive.js }
  - description: "w-03-description: write the description (the pointer) for a three-branch skill body"
    vars:
      case: w-03-description
      request: |-
        Write the frontmatter description for this skill.

        ### skills/app-store-notes/SKILL.md (body only)

        ````
        # App Store release notes

        Turns a version's merged changes into the "What's New" text for the App Store.

        ## Draft from git

        Read the commits since the last release tag, keep only user-visible changes, and write them as short benefit-first lines.

        ## Translate

        When the user asks for other locales, translate the approved English notes into each requested locale, keeping product names in English.

        ## Fit the limit

        When the notes run long, cut them to fit the 4,000-character App Store limit and the 170-character promotional text, dropping the least user-visible lines first.
        ````

        Reply with the frontmatter `description:` line only, nothing else.
    assert:
      - { type: javascript, metric: format, value: file://asserts/format.js }
      - { type: javascript, metric: pointer, value: file://asserts/pointer.js }
  - description: "w-04-onboarding: a skill whose runs end early: vague step bounds to sharpen into checkable completion criteria"
    vars:
      case: w-04-onboarding
      request: |-
        Runs of this skill keep ending before the work is really done. Fix it. It lives at `skills/onboarding-interview/SKILL.md`.

        ### skills/onboarding-interview/SKILL.md

        ````
        ---
        name: onboarding-interview
        description: Interview a new contributor about their project and summarize what they need. Use when someone new joins and wants to get started.
        ---

        # Onboarding interview

        1. Ask the user about their project and goals until understanding is reached.
        2. Explore the codebase thoroughly.
        3. Write the summary to ONBOARDING.md.
        ````

        Reply with the revised file(s) only: each one as a `### <path>` heading followed by a single fenced block holding the whole file. If you split anything into a new file, include it the same way.
    assert:
      - { type: javascript, metric: format, value: file://asserts/format.js }
      - { type: javascript, metric: preserve, value: file://asserts/preserve.js }
      - { type: javascript, metric: steps, value: file://asserts/steps.js }
