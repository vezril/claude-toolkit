# godot: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "inheritance"
  vars: { request: file://cases/inheritance.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/compos|scene|signal|inherit.{0,40}(avoid|instead|rather)|don'?t inherit/i.test(output)) throw new Error('prescribes scene composition over deep inheritance');
        return true;

- description: "callbacks"
  vars: { request: file://cases/callbacks.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/_ready/i.test(output)) throw new Error('names _ready for references');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/_physics_process/i.test(output)) throw new Error('names _physics_process for movement');
        return true;

- description: "autoload"
  vars: { request: file://cases/autoload.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/global|state|dumping|careful|avoid|last|minimi|still a singleton|tamed/i.test(output)) throw new Error('flags autoload as global mutable state');
        return true;
