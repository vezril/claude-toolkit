# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# dsm-depressive — rails and chapter accuracy
# Fully deterministic — no llm-rubric, so no judge and no grader drift.
# Run from the repo root:
#   npx promptfoo@latest eval -c evals/dsm-depressive/promptfooconfig.yaml --no-cache
description: "dsm-depressive — rails and chapter accuracy"
prompts:
  - file://prompt.txt
providers:
  - id: exec:../_provider/claude.sh
    label: sonnet
defaultTest:
  vars:
    skill: file://../../skills/dsm-depressive/SKILL.md
  assert:
    - type: javascript
      metric: rails
      value: file://../_dsm/rails.js
tests: file://tests.yaml
