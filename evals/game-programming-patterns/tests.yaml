# game-programming-patterns: shared matrix, used verbatim by both arms. Deterministic asserts only.

- description: "speculative"
  vars: { request: file://cases/speculative.txt }
  assert:
    - type: javascript
      metric: restraint
      value: |
        if (!/speculativ|don'?t|avoid|real problem|pain|wait|only when|premature|as needed/i.test(output)) throw new Error('warns against applying patterns speculatively');
        return true;

- description: "flags"
  vars: { request: file://cases/flags.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/state machine|\bState\b/i.test(output)) throw new Error('prescribes a State machine');
        return true;

- description: "hotloop"
  vars: { request: file://cases/hotloop.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/object pool|pooling/i.test(output)) throw new Error('prescribes Object Pool');
        return true;
    - type: javascript
      metric: accuracy
      value: |
        if (!/measur|profil|hot path|first/i.test(output)) throw new Error('mentions measuring / hot paths');
        return true;
