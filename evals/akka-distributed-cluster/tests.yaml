# akka-distributed-cluster: shared matrix, used verbatim by both arms. Deterministic, fact-shaped asserts.

- description: "stretch"
  vars: { request: file://cases/stretch.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/never|not|separate|autonomous|per.region|don'?t stretch/i.test(output)) throw new Error('says keep each region a separate autonomous cluster');
        return true;

- description: "db"
  vars: { request: file://cases/db.txt }
  assert:
    - type: javascript
      metric: accuracy
      value: |
        if (!/(its|their) own (database|DB)\b|own(s)? (its|their) (own )?(database|DB)\b|separate (database|DB)|per.region (database|DB)|never.{0,30}cross.DB|replicated events|not share/i.test(output)) throw new Error('says each replica owns its database and integrates via replicated events');
        return true;
