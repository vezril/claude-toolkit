# Step registry for delivery-flow: every LLM task prompt the flow can run, with its
# Stage 3 certification evidence. Checked by scripts/delivery-flow/check-certification.py.
# Paths are relative to the repository root. Editing a prompt changes its sha256 and
# un-certifies the step until the suite is re-run and prompt_sha256 is updated.
steps:
  - step: pr-description
    prompt: skills/pr-description/SKILL.md
    certified_version: evals/pr-description/prompts/prompt_v5.md
    prompt_sha256: ef90d38a89e23a178fcaed4cc9d29470cdfff4ec79a71757031b3f4b0ef6f68e
    tier: haiku
    eval: evals/pr-description/
    results: evals/pr-description/results/run_v5_all.json
    criteria: [contract, coverage, fidelity]
    load_bearing: evals/pr-description/load-bearing.md
    iteration_log: evals/pr-description/iteration-log.md
    escalation_evidence: null
    known_residual: "Haiku names PostgresFlyerLedger.scala (a class, not a file) on case-08 in about 1 of 3 runs"
