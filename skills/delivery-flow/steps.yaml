# Step registry for delivery-flow: every LLM task prompt the flow can run, with its
# Stage 3 certification evidence. Checked by scripts/delivery-flow/check-certification.py.
# Paths are relative to the repository root. Editing a prompt changes its sha256 and
# un-certifies the step until the suite is re-run and prompt_sha256 is updated.
steps:
  - step: triage
    chain: true
    prompt: skills/delivery-flow/references/triage.md
    certified_version: evals/delivery-triage/prompts/prompt_v8.md
    prompt_sha256: 1c93bde5f48ecd6e677563193806d959e428b29e92f35a86832ce24d096153ba
    tier: sonnet
    eval: evals/delivery-triage/
    results: evals/delivery-triage/results/run_v8_sonnet_run1.json
    consecutive_runs:
      - evals/delivery-triage/results/run_v8_sonnet_run1.json
      - evals/delivery-triage/results/run_v8_sonnet_run2.json
      - evals/delivery-triage/results/run_v8_sonnet_run3.json
    criteria: [schema, classification, domains, grounding]
    load_bearing: evals/delivery-triage/load-bearing.md
    iteration_log: evals/delivery-triage/iteration-log.md
    escalation_evidence: evals/delivery-triage/results/run_v4_haiku.json
    inputs: [item.json]
    outputs: [triage.json]
    known_residual: "clustering sometimes comes back without the infra domain, about 1 run in 3"
  - step: breakdown
    chain: true
    prompt: skills/delivery-flow/references/breakdown.md
    certified_version: evals/delivery-breakdown/prompts/prompt_v6.md
    prompt_sha256: 3a78496e937cc8326f2cf30e7d832b1c5a484769ec771faab45ce4eba3599c66
    tier: sonnet
    eval: evals/delivery-breakdown/
    results: evals/delivery-breakdown/results/run_v6_sonnet_run1.json
    consecutive_runs:
      - evals/delivery-breakdown/results/run_v6_sonnet_run1.json
      - evals/delivery-breakdown/results/run_v6_sonnet_run2.json
      - evals/delivery-breakdown/results/run_v6_sonnet_run3.json
    criteria: [schema, coverage, acceptance, scope]
    load_bearing: evals/delivery-breakdown/load-bearing.md
    iteration_log: evals/delivery-breakdown/iteration-log.md
    escalation_evidence: evals/delivery-breakdown/results/run_v2_all.json
    inputs: [item.json, triage.json]
    outputs: [breakdown.json]
    known_residual: "the DLQ item's idempotency clause is dropped in about 1 run in 3"
  - step: challenge-breakdown
    chain: true
    prompt: skills/delivery-flow/references/challenge-breakdown.md
    certified_version: evals/delivery-challenge/prompts/prompt_v3a.md
    prompt_sha256: 73ef3450e1f4926936fc9483bd2c3a9d724bc6aadcad7f397483ce096977ccc7
    tier: sonnet
    eval: evals/delivery-challenge/
    results: evals/delivery-challenge/results/run_v3a_sonnet_run1.json
    consecutive_runs:
      - evals/delivery-challenge/results/run_v3a_sonnet_run1.json
      - evals/delivery-challenge/results/run_v3a_sonnet_run2.json
      - evals/delivery-challenge/results/run_v3a_sonnet_run3.json
    criteria: [schema, verdict, detection, discipline]
    load_bearing: evals/delivery-challenge/load-bearing.md
    iteration_log: evals/delivery-challenge/iteration-log.md
    escalation_evidence: evals/delivery-challenge/results/run_v1_haiku.json
    inputs: [item.json, triage.json, breakdown.json]
    outputs: [challenge-breakdown.json]
    known_residual: "case-07's vague-outcome finding avoids the detection keywords in about 1 run in 3; haiku reaches 96.3% on this prompt but calls the clean sidebar breakdown WEAKENED in 2 of 3 repeats"
  - step: pr-description
    chain: false
    prompt: skills/pr-description/SKILL.md
    certified_version: evals/pr-description/prompts/prompt_v6.md
    prompt_sha256: e346ee395c5990ff89e69ede43d1a03955cd33fb5e1832d6dae459805e90148a
    tier: haiku
    eval: evals/pr-description/
    results: evals/pr-description/results/run_v6_all.json
    criteria: [contract, coverage, fidelity, risk]
    load_bearing: evals/pr-description/load-bearing.md
    iteration_log: evals/pr-description/iteration-log.md
    escalation_evidence: null
    # Declared when `review` was added: `review.schema.json` names this step a consumer, and
    # `tests/delivery-flow/test_schema_consumers.py` requires the registry to agree. The
    # review's findings arrive as `carry_forward` and this step must address each.
    #
    # Declaring an input does not touch the step's certification: the prompt, its sha and its
    # evidence are unchanged, and the certified suite never read this field.
    inputs: [review.json]
    known_residual: "Haiku names PostgresFlyerLedger.scala (a class, not a file) on case-08 in about 1 of 3 runs; v6 carries two samples (run_v6_all.json 128/132, run_v6_all.s2.json 129/132) where triage, breakdown and challenge-breakdown each carry three consecutive runs, and `consecutive_runs` is absent here rather than listing two, because the gate enforces the three-run rule only when the field is present — a third sample is the honest way to close that gap"

  # The reviewer node, added before the PR (design D1-D3). **Uncertified and declared.**
  #
  # No eval suite exists for it, so it carries no `prompt_sha256`, `results`,
  # `consecutive_runs` or `certified_version`, and `check-certification.py` will refuse it.
  # That refusal is the point: it must be listed in `allow_uncertified` for the flow to run it,
  # every run traces `certified: false`, and those runs are excluded from any certified-only
  # rate. The `full` profile was already outside the Stage 4 claim — this is a sixth uncertified
  # node in it, so the profile is further from a certified chain after this change, not closer.
  #
  # `chain: false` because the certified chain is the `triage` profile and this step is not in
  # it. The `triage` profile gains nothing here and its rate is unaffected.
  #
  # The reviewers are not named here: they come from `templates/delivery-flow/roster.yaml` per
  # work kind, resolved at dispatch, so a roster edit does not need a registry edit. One step
  # fans out to all of them (D1) rather than one step per reviewer, which would make the
  # routing table a function of configuration.
  - step: review
    chain: false
    prompt: skills/delivery-flow/references/review.md
    tier: sonnet
    certified: false
    eval: evals/delivery-review/
    criteria: [contract, accuracy, grounding, assumptions]
    load_bearing: evals/delivery-review/load-bearing.md
    iteration_log: evals/delivery-review/iteration-log.md
    # `results`, `prompt_sha256` and `certified_version` are deliberately ABSENT, not empty.
    # Four iterations have now run on a keyless CLI provider and the log records them, but the
    # best version scores 98/112 (87.5%) against a 95% bar, so there is no certified version
    # to pin and no rate to claim. The log names the three residual groups.
    #
    # The live prompt is now v6. The version it replaced scored **0/28 on `contract`** — it
    # named the six top-level fields and not the nested ones, so the model invented
    # `reviewers[].specialist` and omitted `findings[].finding`, and every artifact it wrote
    # would have failed its own edge. Promoting v6 is a bug fix to a prompt that could not
    # produce a valid artifact, and is deliberately NOT a certification: three consecutive v6
    # samples scored 92.9%, 91.1% and 86.6%, all under the bar.
    inputs: [diff, verify.json, proposal.json]
    outputs: [review.json]
    known_residual: "the suite now measures grounding and verdict correctness over 14 cases, and the best prompt version scores 87.5% against a 95% bar — below it on three groups the log names: the clean case is refuted by both models, Class A assumptions are raised but not always the right one, and a surviving mutant reported in verify.json is read without being understood. The live prompt also scores 0/28 on the output contract, so until v3 is promoted every review artifact this step writes would fail its own edge"
