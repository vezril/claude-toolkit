# Step registry for delivery-flow: every LLM task prompt the flow can run, with its
# Stage 3 certification evidence. Checked by scripts/delivery-flow/check-certification.py.
# Paths are relative to the repository root. Editing a prompt changes its sha256 and
# un-certifies the step until the suite is re-run and prompt_sha256 is updated.
steps:
  - step: triage
    chain: true
    prompt: skills/delivery-flow/references/triage.md
    certified_version: evals/delivery-triage/prompts/prompt_v8.md
    prompt_sha256: 1c93bde5f48ecd6e677563193806d959e428b29e92f35a86832ce24d096153ba
    tier: sonnet
    eval: evals/delivery-triage/
    results: evals/delivery-triage/results/run_v8_sonnet_run1.json
    consecutive_runs:
      - evals/delivery-triage/results/run_v8_sonnet_run1.json
      - evals/delivery-triage/results/run_v8_sonnet_run2.json
      - evals/delivery-triage/results/run_v8_sonnet_run3.json
    criteria: [schema, classification, domains, grounding]
    load_bearing: evals/delivery-triage/load-bearing.md
    iteration_log: evals/delivery-triage/iteration-log.md
    escalation_evidence: evals/delivery-triage/results/run_v4_haiku.json
    inputs: [item.json]
    outputs: [triage.json]
    known_residual: "clustering sometimes comes back without the infra domain, about 1 run in 3"
  - step: pr-description
    chain: false
    prompt: skills/pr-description/SKILL.md
    certified_version: evals/pr-description/prompts/prompt_v5.md
    prompt_sha256: ef90d38a89e23a178fcaed4cc9d29470cdfff4ec79a71757031b3f4b0ef6f68e
    tier: haiku
    eval: evals/pr-description/
    results: evals/pr-description/results/run_v5_all.json
    criteria: [contract, coverage, fidelity]
    load_bearing: evals/pr-description/load-bearing.md
    iteration_log: evals/pr-description/iteration-log.md
    escalation_evidence: null
    known_residual: "Haiku names PostgresFlyerLedger.scala (a class, not a file) on case-08 in about 1 of 3 runs"
