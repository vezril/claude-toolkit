# Step registry for the SDLC pipeline: every LLM task prompt it can run, with its Stage 3
# certification evidence. Checked by scripts/delivery-flow/check-certification.py (which moves
# to scripts/workflow/ with the rest of the substrate).
#
# Same format and same parser as skills/delivery-flow/steps.yaml. Paths are relative to the
# repository root. Editing a prompt changes its sha256 and un-certifies the step until the
# suite is re-run and prompt_sha256 is updated.
#
# **Everything here is uncertified.** No eval suite has been run against any of these prompts,
# so none of them carries `prompt_sha256`, `results` or `consecutive_runs`. That is the honest
# state and it is load-bearing: `check-certification.py` blocks delegation to an uncertified
# step, so this file is what stops the pipeline being driven before its nodes have evidence.
# Section 5 certifies `readiness` first (design D6); the rest follow or stay blocked.
#
# A note on who the reviewers are. Design D1 names `analyst`, `requirements-reviewer` and
# `readiness-reviewer` as nodes. None exists as an agent. The analysis and planning seats are
# the `requirements-analyst`, and every refute-framed reviewer seat is the
# `adversarial-validator` — the same agent in a different chair, which is why task 5.3 asks
# whether to reuse `evals/cross-examine/` for the readiness reviewer. Each seat still needs its
# own certification: the agent is shared, the prompt and its evidence are not.

steps:
  - step: analysis
    segment: analysis
    agent: requirements-analyst
    prompt: skills/requirements-engineering/SKILL.md
    tier: sonnet
    certified: false
    inputs: [item.json]
    outputs: [brief.json]
    known_residual: "no eval suite exists for this step"

  - step: planning
    segment: planning
    agent: requirements-analyst
    prompt: skills/requirements-engineering/SKILL.md
    tier: sonnet
    certified: false
    inputs: [brief.json]
    outputs: [prd.json]
    known_residual: "no eval suite exists for this step"

  - step: planning-review
    segment: planning
    agent: adversarial-validator
    prompt: skills/cross-examine/SKILL.md
    tier: sonnet
    certified: false
    inputs: [prd.json]
    outputs: [prd-verdict.json]
    known_residual: "no eval suite exists for this step"

  - step: solutioning
    segment: solutioning
    agent: solution-architect
    prompt: skills/software-architecture/SKILL.md
    tier: sonnet
    certified: false
    inputs: [prd.json]
    outputs: [design.json]
    known_residual: "no eval suite exists for this step"

  - step: solutioning-review
    segment: solutioning
    agent: adversarial-validator
    prompt: skills/cross-examine/SKILL.md
    tier: sonnet
    certified: false
    inputs: [design.json]
    outputs: [design-verdict.json]
    known_residual: "no eval suite exists for this step"

  # The first segment to be certified (design D6). story-planner decomposes; the reviewer
  # attacks the result. The deterministic gates that used to be the orchestrator's
  # responsibility — lint-story.py and `openspec validate` — are edges now (task 4.5), so
  # neither node is asked to run them and neither can claim they passed.
  - step: readiness
    segment: readiness
    agent: story-planner
    prompt: skills/spec-driven-development/SKILL.md
    tier: haiku
    certified: false
    inputs: [design.json]
    outputs: [stories]
    known_residual: "no eval suite exists for this step"

  # **Not certified, and the gate says exactly why.** Two blockers, recorded rather than
  # worked around, because `check-certification.py` is the authority and it refuses:
  #
  #   1. the three passing result files were produced with `agents/adversarial-validator.md`,
  #      not with the frozen `certified_version` copy. The gate checks that the rows came from
  #      the certified text, and the suite loads the live agent file. Mechanical to fix: point
  #      `promptfooconfig.yaml`'s `agent:` var at the frozen copy and re-run three times.
  #   2. the iteration log has 0 complete iterations and the gate needs >= 2, each with
  #      baseline, hypothesis, change, result and reasoning. **This one is not mechanical.**
  #      The prompt was never iterated — it passed its suite as written — so there are no two
  #      iterations to record, and inventing them would be fiction in the one artifact a
  #      reviewer reads to judge whether the prompt was actually developed.
  #
  # What the evidence does establish, and it is not nothing:
  #   - 3 consecutive 6/6 runs on sonnet (`results/skill_1..3.json`) against a 17-33% baseline
  #     without the agent file, so the prompt is measurably load-bearing;
  #   - 3 criteria, two of them reasoning (`accuracy`, `safety`), with `safety` a
  #     false-positive test — refusing to invent a refutation of a sound analysis;
  #   - a load-bearing map at 12/12 instructions (`evals/cross-examine/load-bearing.md`);
  #   - haiku measured and below the bar (100%, 100%, 83.3%), which is design D7's required
  #     escalation evidence rather than an assumption.
  #
  # So this is a step that *could* be certified by finishing the two items above, not one with
  # no evidence. The fields below are deliberately absent until it is: a registry entry that
  # carried them while the gate failed would read as examined and would not be.
  - step: readiness-review
    segment: readiness
    agent: adversarial-validator
    # The prompt its suite actually loads. Pointing at `skills/cross-examine/SKILL.md`, as the
    # first draft did, would certify a prompt the suite never saw.
    prompt: agents/adversarial-validator.md
    tier: sonnet
    certified: false
    eval: evals/cross-examine/
    criteria: [contract, accuracy, safety]
    load_bearing: evals/cross-examine/load-bearing.md
    iteration_log: evals/cross-examine/iteration-log.md
    escalation_evidence: evals/cross-examine/results/haiku_3.json
    inputs: [stories]
    outputs: [readiness-verdict.json]
    known_residual: "the suite's results were produced with the live agent file rather than the frozen certified_version copy, and the iteration log has no complete iterations; neither case has WEAKENED as its correct answer"
  - step: implementation
    segment: implementation
    agent: test-writer
    prompt: agents/test-writer.md
    tier: sonnet
    certified: false
    inputs: [stories]
    outputs: [tests]
    known_residual: "no eval suite exists for this step"

  - step: implementation-green
    segment: implementation
    agent: implementer
    prompt: agents/implementer.md
    tier: sonnet
    certified: false
    inputs: [tests]
    outputs: [diff]
    known_residual: "no eval suite exists for this step"

  - step: verification
    segment: verification
    agent: qa-test-architect
    prompt: skills/test-strategy/SKILL.md
    tier: sonnet
    certified: false
    inputs: [diff]
    outputs: [review.json]
    known_residual: "no eval suite exists for this step"

  - step: verification-ci
    segment: verification
    agent: ci-watcher
    prompt: agents/ci-watcher.md
    tier: haiku
    certified: false
    inputs: [review.json]
    outputs: [outcome.json]
    known_residual: "no eval suite exists for this step"
